  unit-tests:
    name: Unit Tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: [biome, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # T12073: raised from 35. T12070 restored 199 previously-undiscovered
    # @cleocode/cleo test files to the run (they had never executed — the
    # project's include globs matched nothing), which grew the suite enough
    # that macOS started hitting the ceiling: Ubuntu finishes a shard in ~17
    # minutes, macOS runners are roughly 2x slower, and both macOS shards were
    # cancelled at 35m21s / 35m27s — a timeout, not a failure. 55 leaves real
    # headroom above the ~34-minute macOS baseline instead of sitting on it.
    timeout-minutes: 55
    strategy:
      matrix:
        # Windows shards temporarily disabled pending T9182/T9181 follow-up — pre-existing
        # afterEach hook hangs on injection-chain + orchestrate-engine + paths tests.
        # Linux + macOS validate cross-platform correctness for v2026.5.50.
        # T12177 (gh#1359): macOS runs on what LANDS, not on every PR push.
        # Measured 2026-09-13: `Unit Tests (macos-latest, shard 1)` took 33.0
        # min against 18.6 min for the identical ubuntu shard, and macOS was
        # 4,071 s of the run's 8,290 job-seconds (49%). It was therefore both
        # the entire critical path of every PR and half the cost — while
        # `required_status_checks.strict` guaranteed the commit it validated
        # would be invalidated by the next merge to main. The coverage was
        # real; the commit it covered was never the one that landed.
        #
        # So macOS moves to the two events that ARE the landed commit:
        # `push` to main (post-merge verification, which is what exists today)
        # and `merge_group`. The merge-queue arm is deliberately kept even
        # though this repo cannot use it — merge queue requires an
        # organization-owned repository and `kryptobaseddev` is a personal
        # account, verified 2026-09-13 by a controlled pair against
        # POST /rulesets: `{"type":"merge_queue"}` returns 422 "Invalid rule"
        # while `{"type":"deletion"}` on the same endpoint returns 201. If the
        # repo is ever transferred to an org, macOS becomes a pre-merge gate
        # again by enabling the queue, with no change to this file.
        #
        # The tradeoff this accepts: a macOS-only regression now lands on main
        # before it is detected, instead of blocking the PR. It is detected on
        # the very next push run, against the exact commit that introduced it.
        os: ${{ fromJson((github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        shard: [1, 2]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.0'
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Build worktree-napi native addon BEFORE pnpm install (T9982)
        # Must run before `pnpm install --frozen-lockfile` so that the file:
        # link to crates/worktree-napi picks up the .node binary into the
        # pnpm-managed copy under node_modules/.pnpm/@cleocode+worktree-napi@*.
        # The crate's package.json declares "files": ["worktree-napi.*.node"]
        # so pnpm only copies in artifacts that exist at install time.
        shell: bash
        run: |
          cargo build --release -p worktree-napi
          case "${{ runner.os }}" in
            Linux)
              triple="linux-x64-gnu"
              if [[ "$(uname -m)" == "aarch64" ]]; then
                triple="linux-arm64-gnu"
              fi
              cp target/release/libworktree_napi.so "crates/worktree-napi/worktree-napi.${triple}.node"
              ;;
            macOS)
              triple="darwin-x64"
              if [[ "$(uname -m)" == "arm64" ]]; then
                triple="darwin-arm64"
              fi
              cp target/release/libworktree_napi.dylib "crates/worktree-napi/worktree-napi.${triple}.node"
              ;;
            Windows)
              triple="win32-x64-msvc"
              if [[ "${PROCESSOR_ARCHITECTURE:-}" == "ARM64" ]]; then
                triple="win32-arm64-msvc"
              fi
              cp target/release/worktree_napi.dll "crates/worktree-napi/worktree-napi.${triple}.node"
              ;;
          esac
      - run: pnpm install --frozen-lockfile
      - name: Install ripgrep (required for T1605 callsite-coverage validator)
        uses: ./.github/actions/install-ripgrep
      - name: Build cant-napi native addon for CANT tests
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release -p cant-napi
          case "${{ runner.os }}" in
            macOS)
              triple="darwin-x64"
              if [[ "$(uname -m)" == "arm64" ]]; then
                triple="darwin-arm64"
              fi
              cp target/release/libcant_napi.dylib "crates/cant-napi/cant-napi.${triple}.node"
              ;;
            Windows)
              triple="win32-x64-msvc"
              if [[ "${PROCESSOR_ARCHITECTURE:-}" == "ARM64" ]]; then
                triple="win32-arm64-msvc"
              fi
              cp target/release/cant_napi.dll "crates/cant-napi/cant-napi.${triple}.node"
              ;;
          esac
      - name: Build packages (required for cross-package imports)
        run: pnpm run build
      - name: Generate SvelteKit type stubs (required for studio tests)
        # packages/studio/tsconfig.json extends .svelte-kit/tsconfig.json which
        # is generated by svelte-kit sync. Previously .svelte-kit/ was tracked in
        # git (inadvertently). After adding it to .gitignore (v2026.4.60), we must
        # generate it explicitly in CI before running tests. No user input used.
        run: pnpm --filter @cleocode/studio exec svelte-kit sync
      - name: Resolve test scope (per-package fast path or full shard sweep)
        # On PRs NOT targeting main with ≤3 packages changed, run only the
        # affected package tests via pnpm test:pkg for faster feedback.
        # Always falls back to the full 2-shard sweep when:
        #   - targeting main (cross-platform matrix already handles this)
        #   - more than 3 packages changed (too broad for per-package scoping)
        #   - the changed-package set is ambiguous (root config files touched)
        # Per-package scoping is an OPTIONAL fast path, NOT a replacement.
        # The shard run is always the safe fallback.
        id: test-scope
        shell: bash
        run: |
          # Targeting main always uses full shard sweep (set by matrix strategy).
          # For non-main PRs, check how many individual packages changed.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" != "main" ]]; then
            changed_pkgs=""
            [[ "${{ needs.changes.outputs.core }}"        == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/core"
            [[ "${{ needs.changes.outputs.cleo }}"        == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/cleo"
            [[ "${{ needs.changes.outputs.contracts }}"   == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/contracts"
            [[ "${{ needs.changes.outputs.nexus }}"       == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/nexus"
            [[ "${{ needs.changes.outputs.studio }}"      == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/studio"
            [[ "${{ needs.changes.outputs.adapters }}"    == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/adapters"
            [[ "${{ needs.changes.outputs.agents }}"      == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/agents"
            [[ "${{ needs.changes.outputs.animations }}"  == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/animations"
            [[ "${{ needs.changes.outputs.brain }}"       == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/brain"
            [[ "${{ needs.changes.outputs.caamp }}"       == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/caamp"
            [[ "${{ needs.changes.outputs.cant }}"        == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/cant"
            [[ "${{ needs.changes.outputs.cleo_os }}"     == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/cleo-os"
            [[ "${{ needs.changes.outputs.git_shim }}"    == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/git-shim"
            [[ "${{ needs.changes.outputs.lafs }}"        == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/lafs"
            # mcp-adapter removed (R8 · T11259); MCP transport is part of @cleocode/runtime.
            [[ "${{ needs.changes.outputs.paths }}"       == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/paths"
            [[ "${{ needs.changes.outputs.playbooks }}"   == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/playbooks"
            [[ "${{ needs.changes.outputs.runtime }}"     == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/runtime"
            [[ "${{ needs.changes.outputs.skills }}"      == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/skills"
            [[ "${{ needs.changes.outputs.worktree }}"    == "true" ]] && changed_pkgs="$changed_pkgs @cleocode/worktree"
            changed_pkgs="${changed_pkgs# }"  # trim leading space
            pkg_count=$(echo "$changed_pkgs" | wc -w)
            if [[ -n "$changed_pkgs" && "$pkg_count" -le 3 ]]; then
              echo "mode=per_package_tests" >> "$GITHUB_OUTPUT"
              echo "pkgs=$changed_pkgs"     >> "$GITHUB_OUTPUT"
              echo "Per-package fast path: $changed_pkgs ($pkg_count package(s))"
            else
              echo "mode=shard" >> "$GITHUB_OUTPUT"
              echo "pkgs="      >> "$GITHUB_OUTPUT"
              echo "Full shard sweep: $pkg_count package(s) changed (or root config touched)"
            fi
          else
            echo "mode=shard" >> "$GITHUB_OUTPUT"
            echo "pkgs="      >> "$GITHUB_OUTPUT"
            echo "Full shard sweep: targeting main or push event"
          fi
      - name: Run unit tests — per-package fast path (shard ${{ matrix.shard }}/2)
        if: steps.test-scope.outputs.mode == 'per_package_tests' && matrix.shard == 1
        # Only runs on shard 1 to avoid duplicates; per-package scope is
        # already narrow enough that sharding provides no meaningful benefit.
        run: pnpm test:pkg ${{ steps.test-scope.outputs.pkgs }}
      - name: Run unit tests — full shard sweep (shard ${{ matrix.shard }}/2)
        if: steps.test-scope.outputs.mode != 'per_package_tests'
        shell: bash
        run: |
          set -o pipefail
          # BOTH macOS shards get retry=2 to absorb Darwin vitest+pnpm+timing
          # flakes (T10490 — fake-timers cleanup, pnpm worker-pool contention,
          # and the `EnvironmentTeardownError: Closing rpc while onUserConsoleLog
          # was pending` race where deferred best-effort ops emit console output
          # as the worker tears down). shard 2 was previously unguarded and
          # failed on this non-deterministic teardown race (run 26649981753).
          # Briefing §8.5 prescribed standardizing the macOS retry beyond shard 1.
          # Root cause (deferred-op test-boundary escape) tracked under T10490;
          # retry is the sanctioned interim guard.
          RETRY_FLAG=""
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            RETRY_FLAG="--retry=2"
          fi
          pnpm exec vitest run --shard=${{ matrix.shard }}/2 $RETRY_FLAG 2>&1 | tee /tmp/vitest-shard${{ matrix.shard }}.log
      - name: T9170 — schema-warning budget gate (shard ${{ matrix.shard }}/2)
        if: steps.test-scope.outputs.mode != 'per_package_tests' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: node scripts/check-schema-warning-budget.mjs /tmp/vitest-shard${{ matrix.shard }}.log

  build-verify:
    name: Build & Verify (${{ matrix.os }})
    needs: [biome, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # Windows temporarily disabled pending T9182/T9181 follow-up.
        # T12177 (gh#1359): macOS runs on what LANDS, not on every PR push.
        # Measured 2026-09-13: `Unit Tests (macos-latest, shard 1)` took 33.0
        # min against 18.6 min for the identical ubuntu shard, and macOS was
        # 4,071 s of the run's 8,290 job-seconds (49%). It was therefore both
        # the entire critical path of every PR and half the cost — while
        # `required_status_checks.strict` guaranteed the commit it validated
        # would be invalidated by the next merge to main. The coverage was
        # real; the commit it covered was never the one that landed.
        #
        # So macOS moves to the two events that ARE the landed commit:
        # `push` to main (post-merge verification, which is what exists today)
        # and `merge_group`. The merge-queue arm is deliberately kept even
        # though this repo cannot use it — merge queue requires an
        # organization-owned repository and `kryptobaseddev` is a personal
        # account, verified 2026-09-13 by a controlled pair against
        # POST /rulesets: `{"type":"merge_queue"}` returns 422 "Invalid rule"
        # while `{"type":"deletion"}` on the same endpoint returns 201. If the
        # repo is ever transferred to an org, macOS becomes a pre-merge gate
        # again by enabling the queue, with no change to this file.
        #
        # The tradeoff this accepts: a macOS-only regression now lands on main
        # before it is detected, instead of blocking the PR. It is detected on
        # the very next push run, against the exact commit that introduced it.
        os: ${{ fromJson((github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.0'
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ──────────────────────────────────────────────────────────────────
      # COLD-STATE BUILD GATE
      #
      # Purpose: catch workspace-dependency-order regressions in build.mjs
      # at PR-time, never at release-time.
      #
      # Background: in v2026.4.8 the release workflow failed at the Build
      # step because caamp's tsup DTS resolver couldn't find @cleocode/cant
      # — caamp had grown a new import that depended on cant's .d.ts files
      # being present on disk before caamp built, but build.mjs's order had
      # caamp building first. The bug only reproduced from a fully clean
      # state (no dist, no tsbuildinfo) because local re-builds left stale
      # dist files behind that masked the gap.
      #
      # CI checkouts are already fresh, so this defensive `rm -rf` is
      # belt-and-braces — it guarantees the build runs from zero state
      # regardless of any future caching changes to actions/checkout or
      # actions/cache. If someone reorders build.mjs incorrectly again,
      # this step fails and blocks the merge.
      # ──────────────────────────────────────────────────────────────────
      - name: Build worktree-napi native addon BEFORE pnpm install (T9982)
        # Must run before `pnpm install` so the file:link to crates/worktree-napi
        # picks up the .node binary. See ci.yml unit-tests job for context.
        shell: bash
        run: |
          cargo build --release -p worktree-napi
          case "${{ runner.os }}" in
            Linux)
              triple="linux-x64-gnu"
              if [[ "$(uname -m)" == "aarch64" ]]; then
                triple="linux-arm64-gnu"
              fi
              cp target/release/libworktree_napi.so "crates/worktree-napi/worktree-napi.${triple}.node"
              ;;
            macOS)
              triple="darwin-x64"
              if [[ "$(uname -m)" == "arm64" ]]; then
                triple="darwin-arm64"
              fi
              cp target/release/libworktree_napi.dylib "crates/worktree-napi/worktree-napi.${triple}.node"
              ;;
            Windows)
              triple="win32-x64-msvc"
              if [[ "${PROCESSOR_ARCHITECTURE:-}" == "ARM64" ]]; then
                triple="win32-arm64-msvc"
              fi
              cp target/release/worktree_napi.dll "crates/worktree-napi/worktree-napi.${triple}.node"
              ;;
          esac
      - run: pnpm install --frozen-lockfile
      - name: Install ripgrep (required for T1605 callsite-coverage validator)
        uses: ./.github/actions/install-ripgrep
      - name: Cold-state cleanup (defense against build-order regressions)
        shell: bash
        run: |
          rm -rf packages/*/dist packages/*/tsconfig.tsbuildinfo
          echo "Cleaned dist and tsbuildinfo from all packages."
      - name: Build all packages from cold state (catches dep-order regressions)
        run: node build.mjs
      - name: Verify core dist exists
        shell: bash
        run: |
          test -f packages/core/dist/index.js || (echo "packages/core/dist/index.js missing" && exit 1)
      - name: Verify lafs dist exists
        shell: bash
        run: |
          test -f packages/lafs/dist/src/index.js || (echo "packages/lafs/dist/src/index.js missing" && exit 1)
      - name: Verify caamp dist exists
        shell: bash
        run: |
          test -f packages/caamp/dist/index.js || (echo "packages/caamp/dist/index.js missing" && exit 1)
      - name: Verify cant dist exists
        shell: bash
        run: |
          test -f packages/cant/dist/index.js || (echo "packages/cant/dist/index.js missing" && exit 1)
      - name: Verify runtime dist exists
        shell: bash
        run: |
          test -f packages/runtime/dist/index.js || (echo "packages/runtime/dist/index.js missing" && exit 1)
      - name: Verify CLI binary
        shell: bash
        run: node packages/cleo/dist/cli/index.js version
      # T12116: execute the bin shim through its OWN SHEBANG, on every platform
      # in the matrix. Until now nothing in CI did — "Verify CLI binary" above
      # invokes `dist/cli/index.js` directly, and the only other reference to
      # `bin/cleo.js` in any workflow is a `chmod +x`. So the entry point every
      # user actually types had zero coverage of the path that resolves it.
      #
      # That matters most for the shebang itself, which carries Node flags via
      # `env -S`. If a platform's `env` rejects `-S` the shim does not degrade —
      # it fails to start at all, because there is no interpreter to fall back
      # to, and the in-file fallback never runs. `node bin/cleo.js` would pass
      # while the real invocation was broken, so this step must NOT use `node`.
      - name: Verify bin shim runs via its shebang
        shell: bash
        run: |
          chmod +x packages/cleo/bin/cleo.js
          ./packages/cleo/bin/cleo.js --version
      - name: Verify runtime gateway/mcp dist exists
        # R8 (T11259): standalone packages/mcp-adapter deleted; MCP transport consolidated
        # into @cleocode/runtime/gateway/mcp. Verify the runtime dist ships the mcp adapter.
        shell: bash
        run: |
          test -f packages/runtime/dist/gateway/mcp/index.js || (echo "packages/runtime/dist/gateway/mcp/index.js missing — build.mjs did not build @cleocode/runtime" && exit 1)
      - name: Core bundle-budget + submodule tree-shake gate (T11582 · R10-L3)
        # Build-time companion to check-core-tarball-size.mjs (which runs at
        # release-tag time and needs the Rust supervisor fallback). Asserts the
        # built dist/ stays within budget AND that importing one
        # @cleocode/core/<submodule> tree-shakes (does NOT drag all of core into
        # a consumer). Deterministic, esbuild byte output is platform-independent,
        # so run it once on Linux. The full build above already produced dist/.
        if: runner.os == 'Linux'
        shell: bash
        run: node packages/core/scripts/check-core-bundle-budget.mjs

  validate-json:
    name: Validate JSON Schemas
    needs: [biome, changes]
    if: needs.changes.outputs.schemas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Validate JSON schema files
        run: |
          find packages -name '*.json' -path '*/schemas/*' | while read file; do
            echo "Validating: $file"
            jq empty "$file"
          done

  install-test:
    name: Install Test
    needs: [biome, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.0'
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Build worktree-napi native addon BEFORE pnpm install (T9982)
        shell: bash
        run: |
          cargo build --release -p worktree-napi
          cp target/release/libworktree_napi.so crates/worktree-napi/worktree-napi.linux-x64-gnu.node
      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && node build.mjs
      - name: Test global link (simulates global install)
        run: |
          cd packages/cleo && pnpm link --global && cd ../..
          cleo version
          cleo --help
      - name: Test MCP server flag
        run: timeout 5 cleo --mcp-server 2>&1 || true
      - name: Test project initialization
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          cleo init test-project
          ls -la .cleo/
      - name: Cleanup
        if: always()
        run: pnpm unlink --global @cleocode/cleo

  worktree-napi-gate:
    name: Worktree NAPI Prebuild Gate (T11127)
    # T12094: `actions: write` lets this job APPROVE a prebuild run that GitHub
    # queued as `action_required` — which is the state of every run triggered by
    # a GITHUB_TOKEN-created pull_request, i.e. every release bump-PR. Without it
    # the gate can only report the manual command and fail.
    permissions:
      actions: write
      contents: read
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for worktree-napi prebuild on all 4 targets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          # Check if the prebuild workflow has any runs for this commit
          RUN_JSON=$(gh run list \
            --workflow=worktree-napi-prebuild.yml \
            --branch="${{ github.head_ref || github.ref_name }}" \
            --limit=5 --json status,conclusion,headSha,databaseId,event \
            2>/dev/null || echo '[]')

          MATCHING_RUN=$(echo "$RUN_JSON" | jq -r --arg sha "$COMMIT_SHA" \
            'map(select(.headSha == $sha and .event != "workflow_dispatch")) | sort_by(.databaseId) | last // empty')

          if [ -z "$MATCHING_RUN" ] || [ "$MATCHING_RUN" = "null" ]; then
            echo "○ No prebuild workflow run triggered for $COMMIT_SHA"
            echo "  (no matching paths — gate passes)"
            exit 0
          fi

          RUN_STATUS=$(echo "$MATCHING_RUN" | jq -r '.status')
          RUN_ID=$(echo "$MATCHING_RUN" | jq -r '.databaseId')

          echo "Found prebuild run #$RUN_ID (status: $RUN_STATUS)"

          if [ "$RUN_STATUS" = "completed" ]; then
            CONCLUSION=$(echo "$MATCHING_RUN" | jq -r '.conclusion')
            # T12094: `action_required` is NOT a failure — it means GitHub queued
            # the run pending human approval, which is what happens to every run
            # triggered by a GITHUB_TOKEN-created pull_request (the release
            # bump-PR). Reading it as failure blocked v2026.8.5 on a prebuild that
            # had never been allowed to start. Try to approve it and wait; if we
            # lack the permission, say so precisely instead of reporting a build
            # failure that did not occur.
            if [ "$CONCLUSION" = "action_required" ]; then
              echo "⏸ prebuild run #$RUN_ID is queued pending approval (GITHUB_TOKEN-created event)."
              if gh api -X POST "repos/${{ github.repository }}/actions/runs/$RUN_ID/approve" >/dev/null 2>&1; then
                echo "  approved — waiting for it to finish"
                if gh run watch "$RUN_ID" --exit-status 2>/dev/null; then
                  echo "✓ worktree-napi prebuild passed on all 4 platform targets"
                  exit 0
                fi
                echo "✗ prebuild failed after approval — see run #$RUN_ID"
                exit 1
              fi
              echo "::error::prebuild run #$RUN_ID needs approval and this token cannot grant it."
              echo "  Approve it manually: gh api -X POST repos/${{ github.repository }}/actions/runs/$RUN_ID/approve"
              exit 1
            fi
            if [ "$CONCLUSION" = "success" ]; then
              echo "✓ worktree-napi prebuild passed on all 4 platform targets"
              exit 0
            else
              echo "✗ worktree-napi prebuild completed with conclusion: $CONCLUSION"
              echo "  View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID"
              exit 1
            fi
          fi

          # Wait for the run to complete (up to 12 minutes)
          echo "Waiting for prebuild run #$RUN_ID to complete..."
          if gh run watch "$RUN_ID" --exit-status 2>/dev/null; then
            echo "✓ worktree-napi prebuild passed on all 4 platform targets"
            exit 0
          else
            echo "✗ worktree-napi prebuild failed or timed out"
            echo "  View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID"
            exit 1
          fi

  forge-ts-check:
    name: Documentation Coverage (forge-ts)
    needs: [biome, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Runtime is ~4-5 min on a warm runner; the previous 5-minute budget was
    # routinely hit on slower runners, and a TIMEOUT concludes the job as
    # `cancelled` — which `continue-on-error` does NOT mask (T11967).
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install ripgrep (required for T1605 callsite-coverage validator)
        uses: ./.github/actions/install-ripgrep
      - name: Check TSDoc coverage
        run: pnpm exec forge-ts check --human || true
      - name: Build documentation
        run: pnpm exec forge-ts build || true

  # ──────────────────────────────────────────────────────────────────────────
  # gh#1403: the scripts/ test project, which nothing used to run on a
  # scripts-only PR.
  #
  # `scripts/__tests__/*.test.mjs` is a real vitest project — name `scripts`,
  # listed in the root config's `projects:` array — but the `code` filter that
  # gates `unit-tests` matches no path under `scripts/`. A PR touching only
  # scripts/ therefore skipped every test job, and because this workflow's
  # aggregate accepts `skipped` as a pass, it rendered CLEAN. Measured on
  # #1401, a PR whose entire content was 13 new tests: all of Unit Tests, Type
  # Check, Build & Verify and Install Test reported `skipping`.
  #
  # Scoped rather than folded into `code` on purpose: a scripts-only change can
  # only affect this project, and running the full 777-file suite (~19 min per
  # shard) to cover it would put the whole matrix on the PR critical path for
  # a one-file edit.
  #
  # WHY THIS RUNS SELECTED FILES AND NOT THE WHOLE PROJECT
  # -----------------------------------------------------
  # `vitest run --project=scripts` is RED on main today: measured 2026-09-14,
  # 16 failed / 472 passed across 5 files. At least two of those are failing
  # DELIBERATELY — lint-stdout-discipline.test.mjs and
  # lint-stdout-write-allowlist.test.mjs both say "is expected to fail today"
  # in their own comments, because they assert a `--strict` mode the committed
  # baseline has not reached. So "run the project" cannot be a blocking gate
  # until someone decides what the gate asserts, which is a separate piece of
  # work (gh#1403).
  #
  # Making it advisory instead was considered and rejected: a test job that
  # cannot fail is the thing that looks like coverage and isn't, and unlike the
  # post-deploy verifier — which runs after publish and so can prevent nothing
  # either way — a test gate sits exactly where prevention happens.
  #
  # So it gates on the files THIS change is responsible for: the test files it
  # edits, plus the sibling test of any script it edits. The 16 stay red and
  # visible without blocking unrelated work, and the gate tightens on its own
  # as they are fixed.
  #
  # KNOWN GAP, stated so nobody reads this as full coverage: a PR that changes
  # scripts/foo.mjs where scripts/__tests__/foo.test.mjs does not exist runs
  # nothing. That is strictly smaller than the gap it replaces — which was
  # "nothing runs, ever, and the PR renders CLEAN" — but it is real.
  #
  # Safe to run scoped only because #1393 made scripts/vitest.config.ts spread
  # MEMORY_SAFE_TEST_DEFAULTS directly. It previously relied on `extends: true`,
  # which resolves to nothing when the project is its own root — the unbounded
  # shape that froze a developer machine twice (gh#1354, T12087).
  # ──────────────────────────────────────────────────────────────────────────
  scripts-tests:
    name: Scripts Tests
    needs: [biome, changes]
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the PR base to find which test files this
          # change is responsible for.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.0'
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Select the test files this change is responsible for
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            BASE="$BASE_SHA"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Comparing against $BASE"
          CHANGED="$(git diff --name-only "$BASE"...HEAD -- 'scripts/**' || true)"
          echo "Changed under scripts/:"; echo "$CHANGED" | sed 's/^/  /'

          # 1. Test files the PR edits directly.
          # 2. The SIBLING test of any script the PR edits — so changing
          #    scripts/lint-foo.mjs runs scripts/__tests__/lint-foo.test.mjs
          #    even when the test itself is untouched. Without this, the job
          #    only ever covers PRs that happen to edit a test.
          SELECTED=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ -f "$f" ]] || continue
            case "$f" in
              scripts/__tests__/*.test.mjs)
                SELECTED+="$f"$'\n' ;;
              scripts/*.mjs)
                sib="scripts/__tests__/$(basename "$f" .mjs).test.mjs"
                [[ -f "$sib" ]] && SELECTED+="$sib"$'\n' ;;
            esac
          done <<< "$CHANGED"

          SELECTED="$(printf '%s' "$SELECTED" | sort -u | sed '/^$/d')"
          COUNT="$(printf '%s' "$SELECTED" | grep -c . || true)"
          echo "Selected $COUNT test file(s):"; echo "$SELECTED" | sed 's/^/  /'
          {
            echo "count=$COUNT"
            echo "files<<EOF"
            echo "$SELECTED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.select.outputs.count != '0'
        run: pnpm install --frozen-lockfile
      - name: Build packages (selected tests spawn scripts that import built dist)
        # gh#1403 follow-up. This job installed but never built, and several
        # scripts/ tests spawn a script that imports `@cleocode/core`'s built
        # output — `lint-changesets.test.mjs` is the clear case: all five of its
        # assertions expect exit 0 or 1, and with no dist the script exits 2
        # before parsing anything, so every one fails.
        #
        # This went unnoticed because the sibling-test rule that selects such a
        # test is itself new. A PR editing scripts/lint-changesets.mjs is the
        # first thing that ever ran that file here, and it failed on a missing
        # prerequisite rather than on its own change. Selecting a test without
        # being able to satisfy what it needs is not coverage.
        if: steps.select.outputs.count != '0'
        run: pnpm run build
      - name: Run the selected scripts tests
        if: steps.select.outputs.count != '0'
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t FILES <<< "${{ steps.select.outputs.files }}"
          echo "Running ${#FILES[@]} test file(s) in the scripts project:"
          printf '  %s\n' "${FILES[@]}"

          REPORT="${RUNNER_TEMP:-/tmp}/scripts-run.json"
          pnpm exec vitest run --project=scripts \
            --reporter=default --reporter=json --outputFile="$REPORT" \
            "${FILES[@]}"
          RC=$?

          # The selection count is the count of what this job CHOSE, not of what
          # vitest RAN. Measured 2026-09-14: given one collectable path and one
          # that matches no include, vitest runs the first, ignores the second
          # and exits 0 — "Test Files 1 passed (1)" for a two-file selection.
          # A total miss does exit 1, so only the PARTIAL case is silent, and it
          # is the one a rename or a config change would produce.
          node scripts/assert-vitest-collected.mjs "$REPORT" "${FILES[@]}"
          ARC=$?

          if [[ $RC -ne 0 ]]; then exit $RC; fi
          exit $ARC
      - name: No scripts tests are implicated by this change
        if: steps.select.outputs.count == '0'
        run: |
          echo "This PR touches scripts/ but implicates no test file:"
          echo "  - it edits no scripts/__tests__/*.test.mjs, and"
          echo "  - no script it edits has a sibling test."
          echo
          echo "Nothing to run. This is a KNOWN GAP, not coverage (gh#1403):"
          echo "a script with no sibling test is still unverified by this job."

  # ──────────────────────────────────────────────────────────────────────────
  # Aggregate success gate. Branch protection on `main` requires a single
  # status context named "CI"; this job IS that context. GitHub posts one
  # check-run per *job* (not per workflow), so the workflow being named "CI"
  # never produced a "CI" check — the required context was a phantom that
  # blocked every PR's normal-merge path (only an admin override could merge).
  #
  # This job runs ALWAYS (even when upstream jobs are skipped by the path
  # filter) and fails iff any upstream job concluded `failure` or `cancelled`.
  # `skipped` (path-filtered) and `success` are accepted, so docs-only PRs that
  # skip the code jobs still satisfy the gate.
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - biome
      - adr-index-jsonl-frozen-lint
      - worktree-location-lint
      - orphan-cleo-dir-check
      - agent-outputs-registration
      - ssot-lint
      - path-drift-lint
      - project-root-anti-pattern-lint
      - paths-ssot-lint
      - cwd-walkup-lint
      - saga-label-anti-pattern-lint
      - invariant-registry-lint
      - invariants-docs-render-drift
      - tier-snapshot-drift
      - raw-git-worktree-lint
      - saga-symbol-leakage-lint
      - json-stream-hygiene-lint
      - rust-vendor-parity-lint
      - lafs-envelope-conformance
      - contracts-dep-lint
      - contracts-fan-out-lint
      - raw-cr-writes-lint
      - format-error-misuse-lint
      - deprecations-lint
      - pragma-drift
      - db-open-guard
      - cross-db-annotation-lint
      - core-first-lint
      - ssot-exempt-lint
      - deployed-template-parity
      - cli-boundary-lint
      - dockind-writer-uniqueness
      - docs-similarity-lint
      - manual-write-sweep
      - canon-drift
      - canon-check
      - docs-drift
      - migration-integrity
      - migration-lint
      - exodus-parity-gate
      - drizzle-kit-check
      - typecheck
      - unit-tests
      - scripts-tests
      - build-verify
      - validate-json
      - install-test
      - worktree-napi-gate
      - forge-ts-check
    steps:
      - name: Verify every required job passed (or was skipped)
        env:
          # `join(needs.*.result)` yields the RESULTS ONLY, with no job names —
          # which is why this gate could not say what went wrong (gh#1358). It
          # is retained because `lint-merge-bar-aggregate` asserts this exact
          # expression is present as proof the job gates on upstream results.
          RESULTS: ${{ join(needs.*.result, ',') }}
          # The same data keyed BY JOB NAME, which is what lets the messages
          # below name the offender instead of saying "one or more".
          NEEDS_JSON: ${{ toJSON(needs) }}
          # forge-ts-check is ADVISORY (continue-on-error: true). It stays in
          # `needs` (the merge-bar lint requires every sibling to gate), but
          # its result is carved out below: a job that hits its timeout
          # concludes `cancelled`, which continue-on-error does NOT mask, and
          # that repeatedly hard-failed unrelated PRs (T11967).
          ADVISORY_RESULT: ${{ needs.forge-ts-check.result }}
        run: |
          echo "Upstream job results: ${RESULTS}"
          echo "Advisory forge-ts-check result: ${ADVISORY_RESULT}"

          # gh#1358: `failure` and `cancelled` were collapsed into one red with
          # one message naming neither. Measured across 40 open PRs, four showed
          # `CI FAILURE` with ZERO failing jobs — in every case the only FAILURE
          # entry was this aggregate itself, reacting to a single cancellation.
          # A reader's cheapest interpretation of a red CI is "a test broke",
          # and it was wrong on all four. Both states still close the merge bar;
          # what changes is that the reader is told WHICH, and which job.
          #
          # `jq` is preinstalled on GitHub-hosted runners.
          ADVISORY_JOBS='forge-ts-check'
          names_with() {   # names_with <result>
            printf '%s' "${NEEDS_JSON}" \
              | jq -r --arg r "$1" 'to_entries[] | select(.value.result == $r) | .key' \
              | grep -vxF "${ADVISORY_JOBS}" || true
          }
          failed=$(names_with failure)
          cancelled=$(names_with cancelled)

          if printf '%s' "${ADVISORY_RESULT}" | grep -qE '^(failure|cancelled)$'; then
            echo "::warning::Advisory job forge-ts-check concluded '${ADVISORY_RESULT}' — not gating (T11967)."
          fi

          {
            echo "### CI aggregate"
            echo
            echo "| outcome | jobs |"
            echo "|---|---|"
            echo "| failed | ${failed:-_none_} |"
            echo "| cancelled | ${cancelled:-_none_} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ -n "${failed}" ]; then
            echo "::error title=CI: required jobs FAILED::$(printf '%s' "${failed}" | tr '\n' ' ')"
            # NOT `[ -n "$x" ] && echo ...` — GitHub runs `run:` under `bash -e`,
            # where a false test is a non-zero command and aborts the step
            # before `exit 1` is reached, turning a named failure back into an
            # unexplained one. Exactly the class of defect this block fixes.
            if [ -n "${cancelled}" ]; then
              echo "::error title=CI: also cancelled::$(printf '%s' "${cancelled}" | tr '\n' ' ')"
            fi
            exit 1
          fi

          if [ -n "${cancelled}" ]; then
            # No job failed. Something cancelled these — usually a newer push
            # superseding this run (concurrency: cancel-in-progress), sometimes
            # a job outliving its siblings. Either way NO TEST BROKE, and the
            # fix is a re-run, not an investigation.
            echo "::error title=CI: cancelled, NOT failed — re-run, do not investigate::$(printf '%s' "${cancelled}" | tr '\n' ' ') were CANCELLED. No job reported a failure. This aggregate is red because a cancelled job is not a pass, not because a test broke."
            exit 1
          fi

          echo "All required CI jobs succeeded or were skipped."
