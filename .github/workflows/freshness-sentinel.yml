name: Freshness Sentinel

# @task T10102
# @task T13927
# Owner-CI cron (docs/release/workflow-inventory.md §7). It failed daily from
# 2026-05-18 because `tsx` is not installed, Node 22 is below the engines
# floor, and `cleo` was never on PATH while every canary step ran `|| true`
# (T13927). Each step now fails on its own error.

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print alert but do not create issue)'
        type: boolean
        default: false

jobs:
  check-dream-freshness:
    name: Check BRAIN dream cycle health
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLEO CLI
        run: pnpm run build

      - name: Put cleo on PATH
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/cleo-bin"
          mkdir -p "$bin"
          printf '#!/usr/bin/env bash\nexec node "%s/packages/cleo/dist/cli/index.js" "$@"\n' "$GITHUB_WORKSPACE" > "$bin/cleo"
          chmod +x "$bin/cleo"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/cleo" --version

      - name: Initialize canary CLEO project
        run: |
          set -euo pipefail
          mkdir -p /tmp/cleo-canary
          cd /tmp/cleo-canary
          git init -q
          cleo init
          # Seed a handful of observations so status is meaningful
          for i in $(seq 1 20); do
            cleo memory observe "Canary observation $i: testing freshness sentinel" --title "Canary $i" --output silent
          done
          # A fresh store that never dreamed is overdue by definition; the
          # check is that one cycle consolidates the seeded observations.
          cleo memory dream
        env:
          CLEO_PROJECT_ROOT: /tmp/cleo-canary

      - name: Run freshness sentinel
        # Node 24 strips TypeScript types natively; no tsx needed.
        run: node scripts/freshness-sentinel.ts
        env:
          CLEO_PROJECT_ROOT: /tmp/cleo-canary
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Additional fallback: add a comment to the run summary
            const msg = '⚠️ BRAIN dream cycle freshness check FAILED. Run `cleo memory dream` manually or check the sentient daemon.';
            core.warning(msg);
            await core.summary
              .addHeading('Dream Cycle Alert')
              .addRaw(msg)
              .write();
